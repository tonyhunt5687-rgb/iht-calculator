<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nurse Clara | Health Assessment | IHT Solutions</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #1F4E78;
      --blue-lt: #EBF3FA;
      --green:   #27ae60;
      --gray:    #6c757d;
      --gray-lt: #f8f9fa;
      --border:  #dee2e6;
      --radius:  12px;
      --font:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font);
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ── Header ── */
    .header {
      background: var(--blue);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 17px; font-weight: 600; }
    .header-text p  { font-size: 12px; opacity: 0.75; margin-top: 1px; }

    .progress-bar {
      margin-left: auto;
      text-align: right;
      flex-shrink: 0;
    }
    .progress-label { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
    .progress-track {
      width: 120px;
      height: 5px;
      background: rgba(255,255,255,0.2);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #5dade2;
      border-radius: 99px;
      transition: width 0.5s ease;
      width: 0%;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .bubble-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble-wrap.user { margin-left: auto; flex-direction: row-reverse; }
    .bubble-wrap.bot  { margin-right: auto; }

    .bubble-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
    }
    .bubble-wrap.bot  .bubble {
      background: white;
      color: #212529;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .bubble-wrap.user .bubble {
      background: var(--blue);
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 14px 18px;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: var(--gray);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-8px); }
    }

    /* ── Buttons area ── */
    .button-row {
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: white;
    }
    .btn-choice {
      border: 2px solid var(--blue);
      background: white;
      color: var(--blue);
      padding: 9px 18px;
      border-radius: 99px;
      font-size: 14px;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-choice:hover { background: var(--blue); color: white; }

    /* ── Input area ── */
    .input-area {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 99px;
      padding: 11px 18px;
      font-size: 15px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus { border-color: var(--blue); }
    .input-area input:disabled { background: var(--gray-lt); cursor: not-allowed; }
    .btn-send {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Complete state ── */
    .complete-banner {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 14px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      flex-shrink: 0;
    }

    /* ── Error ── */
    .error-bubble {
      background: #fdecea;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin: 0 16px;
    }

    /* ── Resume banner ── */
    #resume-banner {
      background: #fff3cd;
      border-bottom: 1px solid #ffc107;
      padding: 10px 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #resume-banner button {
      background: var(--blue);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 99px;
      cursor: pointer;
      font-size: 13px;
    }
    #resume-banner .dismiss {
      background: none;
      color: var(--gray);
      font-size: 18px;
      padding: 0 4px;
    }

    @media (max-width: 480px) {
      .bubble-wrap { max-width: 92%; }
      .progress-track { width: 80px; }
      .header-text p { display: none; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header class="header">
  <div class="header-avatar">&#128105;&#8205;&#9877;&#65039;</div>
  <div class="header-text">
    <h1>Nurse Clara</h1>
    <p>IHT Solutions — Health Assessment</p>
  </div>
  <div class="progress-bar" id="progress-bar" style="display:none;">
    <div class="progress-label" id="progress-label">Section 1 of 16</div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
</header>

<!-- ── Resume banner (shown if previous session detected) ── -->
<div id="resume-banner" style="display:none;">
  <span>You have an unfinished session. Would you like to continue where you left off?</span>
  <button onclick="resumeSession()">Resume</button>
  <button class="dismiss" onclick="dismissResume()" title="Start fresh">&#x2715;</button>
</div>

<!-- ── Chat area ── -->
<div class="chat-area" id="chat-area"></div>

<!-- ── Button choices ── -->
<div class="button-row" id="button-row" style="display:none;"></div>

<!-- ── Complete banner ── -->
<div class="complete-banner" id="complete-banner" style="display:none;">
  &#10003; Your health assessment is complete. Your adviser will be in touch shortly.
</div>


<!-- ── Input area ── -->
<div class="input-area" id="input-area">
  <input
    type="text"
    id="user-input"
    placeholder="Type your answer here…"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
    disabled
  >
  <button class="btn-send" id="send-btn" disabled onclick="handleSend()">&#10148;</button>
</div>

<script>
  // ── Configuration ──────────────────────────────────────────────────────────
  const CONFIG = {
    // Update this to your Railway deployment URL after first deploy
    API_URL: 'https://nurse-clara-api-production.up.railway.app',
    SESSION_KEY: 'nurseClara_sessionId',
    SESSION_TIME_KEY: 'nurseClara_lastActive',
    SESSION_EXPIRY_MINUTES: 60
  };
  // ──────────────────────────────────────────────────────────────────────────

  let sessionId = null;
  let isWaiting = false;
  let isComplete = false;

  const chatArea    = document.getElementById('chat-area');
  const buttonRow   = document.getElementById('button-row');
  const inputEl     = document.getElementById('user-input');
  const sendBtn     = document.getElementById('send-btn');
  const progressBar = document.getElementById('progress-bar');
  const progressLbl = document.getElementById('progress-label');
  const progressFil = document.getElementById('progress-fill');

  // ── Init ──────────────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    const savedId   = localStorage.getItem(CONFIG.SESSION_KEY);
    const savedTime = localStorage.getItem(CONFIG.SESSION_TIME_KEY);

    if (savedId && savedTime) {
      const minutesAgo = (Date.now() - parseInt(savedTime)) / 60000;
      if (minutesAgo < CONFIG.SESSION_EXPIRY_MINUTES) {
        document.getElementById('resume-banner').style.display = 'flex';
        document.getElementById('resume-banner').dataset.sessionId = savedId;
        return;
      }
    }
    startNewSession();
  });

  // ── Session management ────────────────────────────────────────────────────
  async function startNewSession() {
    clearSavedSession();
    setWaiting(true);
    showTyping();

    // Extract ref from URL query string e.g. /health?ref=SMITH-2026-001
    const params   = new URLSearchParams(window.location.search);
    const ref      = params.get('ref') || null;
    const source   = params.get('source') || 'direct';

    try {
      const data = await apiPost('/api/session/create', { ref, source });
      sessionId = data.sessionId;
      saveSession(sessionId);

      removeTyping();
      addBotBubble(data.response);
      if (data.buttons) showButtons(data.buttons);
      setWaiting(false);
    } catch (err) {
      removeTyping();
      showError('Could not connect to Nurse Clara. Please refresh the page and try again.');
      setWaiting(false);
    }
  }

  async function resumeSession() {
    const savedId = document.getElementById('resume-banner').dataset.sessionId;
    document.getElementById('resume-banner').style.display = 'none';
    setWaiting(true);
    showTyping();

    try {
      const data = await apiFetch(`/api/session/${savedId}`);
      sessionId = data.sessionId;
      saveSession(sessionId);

      removeTyping();

      // Restore conversation history
      for (const msg of data.messages) {
        if (msg.role === 'user') {
          addUserBubble(msg.content);
        } else {
          addBotBubble(msg.content);
        }
      }

      if (data.currentSection) {
        updateProgress(data.currentSection);
      }

      setWaiting(false);
      enableInput();
    } catch (err) {
      removeTyping();
      // Session expired or invalid — start fresh
      clearSavedSession();
      startNewSession();
    }
  }

  function dismissResume() {
    document.getElementById('resume-banner').style.display = 'none';
    startNewSession();
  }

  // ── Sending messages ──────────────────────────────────────────────────────
  async function handleSend() {
    const text = inputEl.value.trim();
    if (!text || isWaiting || isComplete) return;
    sendMessage(text);
  }

  async function handleButtonClick(value) {
    if (isWaiting || isComplete) return;
    hideButtons();
    sendMessage(value);
  }

  async function sendMessage(text) {
    disableInput();
    addUserBubble(text);
    inputEl.value = '';
    setWaiting(true);
    showTyping();

    try {
      const data = await apiPost('/api/chat', { sessionId, message: text });
      removeTyping();
      addBotBubble(data.cleanText);

      if (data.progress) updateProgress(data.progress.section);
      if (data.buttons) showButtons(data.buttons);
      if (data.complete) {
        handleComplete(data.clientEmail || null);
      } else {
        enableInput();
      }

      saveSession(sessionId);
      setWaiting(false);
    } catch (err) {
      removeTyping();
      setWaiting(false);
      enableInput();
      showInlineError('Something went wrong. Please try again.');
    }
  }

  // ── Complete state ────────────────────────────────────────────────────────
  function handleComplete(clientEmail) {
    isComplete = true;
    hideButtons();
    disableInput();
    const banner = document.getElementById('complete-banner');
    banner.textContent = clientEmail
      ? `✓ All done! I've sent a copy of our conversation to ${clientEmail}. Your adviser will be in touch within 24 hours.`
      : '✓ Your health assessment is complete. Your adviser will be in touch shortly.';
    banner.style.display = 'block';
    document.getElementById('input-area').style.display = 'none';
    clearSavedSession();
    updateProgress(16);
  }

  // ── UI helpers ────────────────────────────────────────────────────────────
  function addBotBubble(text) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap bot';
    wrap.innerHTML = `
      <div class="bubble-icon">&#128105;&#8205;&#9877;&#65039;</div>
      <div class="bubble">${formatText(text)}</div>
    `;
    chatArea.appendChild(wrap);
    scrollBottom();
  }

  function addUserBubble(text) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap user';
    wrap.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
    chatArea.appendChild(wrap);
    scrollBottom();
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap bot';
    wrap.id = 'typing-indicator';
    wrap.innerHTML = `
      <div class="bubble-icon">&#128105;&#8205;&#9877;&#65039;</div>
      <div class="bubble typing-dots"><span></span><span></span><span></span></div>
    `;
    chatArea.appendChild(wrap);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function showButtons(options) {
    buttonRow.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-choice';
      btn.textContent = opt;
      btn.onclick = () => handleButtonClick(opt);
      buttonRow.appendChild(btn);
    });
    buttonRow.style.display = 'flex';
  }

  function hideButtons() {
    buttonRow.style.display = 'none';
    buttonRow.innerHTML = '';
  }

  function showError(msg) {
    const div = document.createElement('div');
    div.className = 'error-bubble';
    div.textContent = msg;
    chatArea.appendChild(div);
    scrollBottom();
  }

  function showInlineError(msg) {
    showError(msg);
  }

  function updateProgress(section) {
    const pct = Math.round((section / 16) * 100);
    progressBar.style.display = 'block';
    progressLbl.textContent = `Section ${section} of 16`;
    progressFil.style.width = pct + '%';
  }

  function enableInput() {
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  function disableInput() {
    inputEl.disabled = true;
    sendBtn.disabled = true;
  }

  function setWaiting(val) {
    isWaiting = val;
  }

  function scrollBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ── Session persistence ───────────────────────────────────────────────────
  function saveSession(id) {
    localStorage.setItem(CONFIG.SESSION_KEY, id);
    localStorage.setItem(CONFIG.SESSION_TIME_KEY, Date.now().toString());
  }

  function clearSavedSession() {
    localStorage.removeItem(CONFIG.SESSION_KEY);
    localStorage.removeItem(CONFIG.SESSION_TIME_KEY);
  }

  // ── API helpers ───────────────────────────────────────────────────────────
  async function apiPost(path, body) {
    const res = await fetch(CONFIG.API_URL + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.json();
  }

  async function apiFetch(path) {
    const res = await fetch(CONFIG.API_URL + path);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.json();
  }

  // ── Text formatting ───────────────────────────────────────────────────────
  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatText(str) {
    // Escape HTML, then convert **bold** and newlines
    return escHtml(str)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  // ── Keyboard ──────────────────────────────────────────────────────────────
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
</script>

</body>
</html>
